name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install ruff && ruff check . && ruff format --check .
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [common, atlas-expression-exploration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install "mcp==2.3.0" "scanpy==1.12.5" "anndata==0.13.4" pyarrow pytest setuptools
      - run: pip install --no-deps --no-build-isolation -e packages/common -e packages/${{ matrix.package }}
      - run: python -m pytest packages/${{ matrix.package }}/tests
