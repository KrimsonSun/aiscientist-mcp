name: images
on:
  push:
    tags: ["*-v*"]
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          t="${GITHUB_REF_NAME}"; echo "server=${t%-v*}" >> "$GITHUB_OUTPUT"; echo "version=${t##*-v}" >> "$GITHUB_OUTPUT"
      - if: steps.tag.outputs.server != 'common'
        uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - if: steps.tag.outputs.server != 'common'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/${{ steps.tag.outputs.server }}/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mcp-${{ steps.tag.outputs.server }}:${{ steps.tag.outputs.version }}
