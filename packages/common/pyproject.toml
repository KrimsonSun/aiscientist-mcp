[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiscientist-mcp-common"
version = "0.0.1"
description = "Shared runtime for AiScientist MCP servers: server factory, path checks, Slurm/local job runner, CLI client"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp>=2.3"]

[project.scripts]
aiscientist-mcp = "aiscientist_mcp.common.client:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aiscientist_mcp.*"]
namespaces = true
