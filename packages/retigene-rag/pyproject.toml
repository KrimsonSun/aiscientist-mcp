[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "aiscientist-mcp-retigene-rag"
version = "0.0.1"
description = "MCP server: answer a gene-property question from the RetiGene papers, with a verbatim quote, PMID and page per gene"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["aiscientist-mcp-common>=0.0.2", "anthropic>=1.13", "numpy"]

[project.optional-dependencies]
# Embedding the queries for chunk co-embedding retrieval (torch; the image installs it on CPU).
embed = ["sentence-transformers>=6.2"]
test = ["pytest"]

[project.scripts]
retigene-rag-mcp = "aiscientist_mcp.retigene_rag.server:main"

[tool.uv.sources]
aiscientist-mcp-common = { workspace = true }

[tool.aiscientist-mcp]
# Category of the server; the same names as the skills registry (lijinbio/aiscientist-skills).
category = "literature"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aiscientist_mcp.*"]
namespaces = true

[tool.setuptools.package-data]
"aiscientist_mcp.retigene_rag" = ["reference/*.csv"]
