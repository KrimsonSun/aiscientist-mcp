[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "aiscientist-mcp-__SERVER__"
version = "0.0.1"
description = "__DESCRIPTION__"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["aiscientist-mcp-common>=0.0.2"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
__SERVER__-mcp = "aiscientist_mcp.__MODULE__.server:main"

[tool.uv.sources]
aiscientist-mcp-common = { workspace = true }

[tool.aiscientist-mcp]
# Category of the server; the same names as the skills registry (lijinbio/aiscientist-skills).
category = "__CATEGORY__"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aiscientist_mcp.*"]
namespaces = true
